<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Siro Plan - Gestor de Proyectos y Tareas</title>
    <meta name="description"
        content="Siro Plan es un planificador de tareas para proyectos con temporizador Pomodoro integrado.">
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Karla:ital,wght@0,200..800;1,200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link href="./src/css/styles.css" rel="stylesheet">

    <script type="module" src="./src/js/main.js"></script>
</head>

<body class="app-layout">


    <aside class="sidebar-aside">

        <header class="sidebar-header">
            <div class="logo-cat-icon">
                <span></span>
            </div>
            <div class="logo-text">
                <h2 class="title">Welcome</h2>
                <span class="logo-subtitle">Make time feel lighter</span>
            </div>
        </header>

        <section class="calendar-widget">
        </section>

        <section class="pomodoro-widget">
        </section>

        <footer class="sidebar-footer">
            <span class="footer-icon"></span>
            <p class="footer-text">One little task at a time.</p>
            <p> You're doing purrfectly!</p>
        </footer>
    </aside>

    <main class="view-container">

        <div class="board-container">

            <section class="welcome-banner">
                <div class="banner-text">
                    <h1 class="title">Siro App - Project Management</h1>
                    <p class="subtitle">A little list for a lovely, productive day.</p>
                    <div class="progress-bar">
                        <i class='bx bx-calendar-star bx-sm'></i>
                        <p>Keep it up!</p>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width: 50%;"></div>
                            <span class="progress-text">1/2 tasks done</span>
                        </div>
                    </div>

                </div>
                <div class="banner-siro">
                    <span class="siro-img"></span>
                </div>
            </section>

            <div class="projects-container">

                <section class="projects-section">
                    <div class="tabs-wrapper">

                    </div>
                    <button id="btnProject" class="btn-project">
                        <i class='bx bxs-plus-circle'></i> New Project
                    </button>
                </section>

                <section class="kanban-section">
                    <div class="tasks-section-header">
                        <div class="header-titles">
                            <h2 class="title">My Tasks</h2>
                            <p class="subtitle">Little things to do</p>
                        </div>
                        <button id="btnTask" class="btn btn-primary btn-task"><i class='bx bxs-plus-circle'></i> New
                            Task</button>
                    </div>

                    <div class="kanban-board-layout">
                        <div class="kanban-column" id="column-todo" data-status="To Do">
                            <div class="column-header status-todo">
                                <span class="status-dot"></span>
                                <h3>To Do</h3>
                                <span class="tasks-count-badge">0</span>
                            </div>

                            <div class="cards-dropzone" id="tasks-todo-container">
                            </div>
                        </div>

                        <div class="kanban-column" id="column-inprogress" data-status="In Progress">
                            <div class="column-header status-inprogress">
                                <span class="status-dot"></span>
                                <h3>In Progress</h3>
                                <span class="tasks-count-badge">1</span>
                            </div>

                            <div class="cards-dropzone" id="tasks-inprogress-container">
                            </div>
                        </div>

                        <div class="kanban-column" id="column-done" data-status="Done">
                            <div class="column-header status-done">
                                <span class="status-dot"></span>
                                <h3>Done</h3>
                                <span class="tasks-count-badge">1</span>
                            </div>

                            <div class="cards-dropzone" id="tasks-done-container">
                            </div>
                        </div>
                    </div>

                </section>
            </div>

        </div>

    </main>

</body>
</html>
