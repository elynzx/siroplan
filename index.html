<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Siro Plan - Gestor de Proyectos y Tareas</title>
    <meta name="description"
        content="Siro Plan es un planificador de tareas para proyectos con temporizador Pomodoro integrado.">
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Karla:ital,wght@0,200..800;1,200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/@hackernoon/pixel-icon-library@1.1.0/fonts/iconfont.min.css"
        rel="stylesheet">

    <link href="./src/css/styles.css" rel="stylesheet">

    <script type="module" src="./src/js/main.js"></script>
</head>

<body class="app-layout">


    <aside class="sidebar-aside">

        <header class="sidebar-header">
            <div class="logo-cat-icon">
                <span></span>
            </div>
            <div class="logo-text">
                <h2 class="title">Welcome</h2>
                <span class="logo-subtitle">Make time feel lighter</span>
            </div>
        </header>

        <section class="calendar-widget">
        </section>

        <section class="pomodoro-container">
            <p>Focus Buddy</p>
            <h3>Pomodoro Timer</h3>

            <div class="timer-container">
                <img class="timer-img">
                <div class="timer-option">
                    <p>Pomodoro</p>
                    <p>Short Break</p>
                    <p>Long Break</p>
                </div>
                <div class="timer-display">
                    <p class="time">25:00</p>
                    <p>Ready when you are</p>
                </div>

                <div class="timer-footer">
                    <div class="timer-footer-actions">
                        <button class="btn btn-timer"><i class="hn hn-play-solid"></i>Start</button>
                        <button class="btn btn-timer"><i class="hn hn-pause-solid"></i> Pause</button>
                        <button class="btn btn-timer"><i class="hn hn-refresh-solid"></i></button>
                    </div>
                    <div class="timer-footer-log">
                        <p>Today</p>
                        <div class="timer-log-activity">
                            <i class="hn hn-star-solid"></i>
                            <i class="hn hn-star-solid"></i>
                            <i class="hn hn-star-solid"></i>
                            <i class="hn hn-star-solid"></i>
                        </div>
                        <p>3/4</p>
                    </div>
                </div>
            </div>


        </section>

        <footer class="sidebar-footer">
            <span class="footer-icon"></span>
            <p class="footer-text">One little task at a time.</p>
            <p> You're doing purrfectly!</p>
        </footer>
    </aside>

    <main class="view-container">

        <div class="board-container">

            <section class="banner-container">
                <div class="progress-bar">
                    <i class='bx bx-calendar-star bx-sm'></i>
                    <p>Keep it up!</p>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                        <span class="progress-text">1/2 tasks done</span>
                    </div>
                </div>


                <button id="btnTask" class="btn btn-primary btn-task">
                    <i class='bx bxs-plus-circle'></i> New Task
                </button>
            </section>

            <div class="projects-container">

                <section class="projects-section">
                    <div class="tabs-wrapper">
                    </div>
                    <button id="btnProject" class="btn btn-project">
                        <i class='bx bxs-plus-circle'></i> New Project
                    </button>
                </section>

                <section class="kanban-section">
                    <div class="kanban-board-layout">
                        <div class="kanban-column" id="column-todo" data-status="To Do">
                            <div class="column-header status-todo">
                                <span class="status-dot"></span>
                                <h3>To Do</h3>
                                <span class="tasks-count-badge"></span>
                            </div>

                            <div class="cards-dropzone" id="tasks-todo-container">
                            </div>
                        </div>

                        <div class="kanban-column" id="column-inprogress" data-status="In Progress">
                            <div class="column-header status-inprogress">
                                <span class="status-dot"></span>
                                <h3>In Progress</h3>
                                <span class="tasks-count-badge"></span>
                            </div>

                            <div class="cards-dropzone" id="tasks-inprogress-container">
                            </div>
                        </div>

                        <div class="kanban-column" id="column-inreview" data-status="In Review">
                            <div class="column-header status-done">
                                <span class="status-dot"></span>
                                <h3>In review</h3>
                                <span class="tasks-count-badge"></span>
                            </div>

                            <div class="cards-dropzone" id="tasks-inreview-container">
                            </div>
                        </div>

                        <div class="kanban-column" id="column-done" data-status="Done">
                            <div class="column-header status-done">
                                <span class="status-dot"></span>
                                <h3>Done</h3>
                                <span class="tasks-count-badge"></span>
                            </div>

                            <div class="cards-dropzone" id="tasks-done-container">
                            </div>
                        </div>
                    </div>

                </section>
            </div>

        </div>

    </main>

</body>

</html>
